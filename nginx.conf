server {
    listen 4321;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Gzip
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;
    gzip_min_length 1024;

    # Cache hashed assets aggressively
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # La traduzione inglese della pagina candidature resta navigabile, ma non
    # viene indicizzata: in Google duplicava il sitelink italiano. L'header è
    # necessario oltre al meta lato React, perché lo stesso index.html serve
    # tutte le rotte della SPA anche ai crawler senza JavaScript.
    location ~ ^/en/lavora-con-noi/?$ {
        add_header X-Robots-Tag "noindex, follow" always;
        try_files /index.html =404;
    }

    # SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }
}

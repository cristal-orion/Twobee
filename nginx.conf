server {
    listen 4321;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Gzip
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;
    gzip_min_length 1024;

    # Cache hashed assets aggressively
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # /casestudy è online ma fuori dall'indice (NOINDEX_PATHS in src/App.jsx).
    # Il meta robots di index.html dice "index, follow" — è lo stesso file servito
    # su ogni rotta — e viene riscritto solo da JavaScript a runtime: un crawler
    # che non esegue JS legge esattamente il contrario di quello che vogliamo.
    # L'header lo dichiara senza dipendere dal JS. Se un giorno la pagina va
    # indicizzata, va tolto anche questo blocco, non solo NOINDEX_PATHS.
    # `try_files /index.html =404` e non `try_files $uri /index.html`: con un URI
    # di fallback nginx fa una redirezione interna, la risposta viene generata nel
    # blocco `location /` e l'add_header qui sopra si perde. Indicando il file come
    # controllo (non come ultimo parametro) viene servito dentro questo blocco e
    # l'header sopravvive. Il regex non intercetta mai file veri, solo /casestudy.
    location ~ ^/(en/)?casestudy/?$ {
        add_header X-Robots-Tag "noindex, follow" always;
        try_files /index.html =404;
    }

    # SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }
}

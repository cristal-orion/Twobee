server {
    listen 4321;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Gzip
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;
    gzip_min_length 1024;

    # Cache hashed assets aggressively
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Qui stava il blocco che serviva /casestudy con X-Robots-Tag "noindex,
    # follow", da quando la pagina girava solo nelle proposte commerciali. Ora è
    # nel menu principale e va indicizzata, quindi l'header non c'è più e la
    # rotta cade nel fallback SPA qui sotto come ogni altra.
    #
    # Se una rotta torna a dover stare fuori dall'indice non basta NOINDEX_PATHS
    # in src/App.jsx: quello riscrive il meta robots via JavaScript, e un crawler
    # che non esegue JS legge il "index, follow" statico di index.html. Serve
    # anche un blocco come questo, con una accortezza — `try_files /index.html
    # =404` e non `try_files $uri /index.html`: con un URI di fallback nginx fa
    # una redirezione interna, la risposta viene generata nel blocco `location /`
    # e l'add_header si perde.

    # SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }
}

    <noscript>
      <header>
        <h1>TwoBee — Sistemi di crescita per le PMI del Sud Italia</h1>
        <p>Gli altri ti vendono follower. Noi guidiamo la tua crescita.</p>
      </header>

      <section>
        <h2>Chi è TwoBee</h2>
        <p>TwoBee (ragione sociale: <strong>Two Bee S.r.l.</strong>, P.IVA IT11030281213) è una società di consulenza strategica in ambito Growth & AI per PMI italiane, con sede operativa in Via Guglielmo Marconi 15, 80125 Napoli. Trasformiamo il marketing delle PMI in un sistema di acquisizione clienti misurabile, con impatto diretto sui ricavi. Lavoriamo su KPI di fatturato reale (CAC, NCAC, MER, AMER, LTV) e non su vanity metrics come follower o like. Abbiamo sede al Sud ma seguiamo clienti in tutta Italia, interamente da remoto.</p>
      </section>

      <section>
        <h2>Il problema che risolviamo</h2>
        <p>Hai già investito in marketing ma non vedi risultati? Tre dispersioni tipiche delle PMI italiane:</p>
        <ul>
          <li><strong>Budget bruciato senza KPI</strong>: si spende senza nessun impatto reale sulle vendite.</li>
          <li><strong>Solo vanity metrics</strong>: like e follower non pagano gli stipendi dei dipendenti.</li>
          <li><strong>Dipendenza totale dalle ads</strong>: stacchi il budget e i clienti non arrivano più.</li>
        </ul>
        <p>Per questo abbiamo costruito un sistema, non un'agenzia.</p>
      </section>

      <section>
        <h2>Il nostro metodo in 4 fasi</h2>
        <ol>
          <li><strong>Diagnosi — Analisi delle dispersioni.</strong> Mappiamo dove perdi clienti e budget oggi. Tracciamo i colli di bottiglia del tuo ecosistema prima di toccare qualsiasi campagna.</li>
          <li><strong>Sistema — Architettura di vendita.</strong> Funnel, CRM e automazioni che rendono prevedibile la tua crescita — non un set di ads sparsi.</li>
          <li><strong>Execution — Gestione operativa.</strong> Gestiamo ads, email, content e tracciamenti avanzati. Tu vedi i risultati, non la macchina.</li>
          <li><strong>Reporting — Ritorno sull'investimento.</strong> Analizziamo insieme da dove arrivano i ricavi: CAC, NCAC, MER, AMER, LTV per comprendere i driver del tuo business.</li>
        </ol>
      </section>

      <section>
        <h2>Cosa offriamo</h2>
        <h3>Performance Marketing</h3>
        <p>Campagne paid su Meta, Google, TikTok, LinkedIn, Reddit, Pinterest, Spotify e Mediaset. Ogni euro allocato dove converte, ogni campagna ottimizzata in continuo.</p>
        <h3>Controllo di gestione</h3>
        <p>Studiamo insieme le marginalità e i costi del business per guidare la crescita in modo sostenibile.</p>
        <h3>Growth System</h3>
        <p>Il sistema lavora anche quando sei in ferie: lead scoring, notifiche ai commerciali, follow-up programmati.</p>
      </section>

      <section>
        <h2>Con chi lavoriamo</h2>
        <p>Lavoriamo solo con imprenditori che hanno un prodotto o un servizio sul mercato e la volontà di costruire un sistema di crescita serio:</p>
        <ul>
          <li><strong>Startup</strong> con idea validata e prima trazione — acquisizione misurabile dal day 1, senza bruciare runway.</li>
          <li><strong>PMI</strong> con vendite consolidate e crescita instabile — crescita prevedibile, indipendente da passaparola e rete personale.</li>
          <li><strong>E-commerce</strong> con catalogo attivo e marginalità da difendere — canali profittevoli e funnel sempre attivo per proteggere il margine.</li>
        </ul>
      </section>

      <section>
        <h2>Piani trasparenti</h2>
        <h3>Worker Bee — Per chi inizia</h3>
        <p>Un canale Ads (Meta o Google), CRM base, pipeline di vendita, email automation di benvenuto, report mensile e call strategica.</p>
        <h3>Hive — Per crescere (piano più scelto)</h3>
        <p>Tutto di Worker Bee, più: due canali Ads (Meta + Google), CRM pipeline personalizzata, email automation avanzata, funnel multi-step, A/B test e CRO, KPI dashboard mensile.</p>
        <h3>Royal Queen — Per chi vuole un partner decisionale</h3>
        <p>Tutto di Hive, più: direzione strategica continuativa, analisi ROI per linea di prodotto, lead scoring e automazioni AI, advisory direzionale mensile.</p>
        <h4>La promessa contrattuale (vale per tutti i piani)</h4>
        <ul>
          <li><strong>Trasparenza contrattuale</strong>: contratto minimo di 6 mesi, condizioni chiare e leggibili.</li>
          <li><strong>Puntualità analitica</strong>: report mensile garantito entro i primi 5 giorni.</li>
          <li><strong>Etica finanziaria</strong>: nessun costo nascosto. Il prezzo che vedi è il prezzo che paghi.</li>
          <li><strong>Clausola di uscita</strong>: dopo 90 giorni puoi uscire senza penali se non sei soddisfatto.</li>
        </ul>
      </section>

      <section>
        <h2>Il team</h2>
        <ul>
          <li><strong>Marco Lucci</strong> — Founder &amp; Strategist. Costruisce strategie e relazioni di lungo periodo con i clienti.</li>
          <li><strong>Toto Piacente</strong> — Co-Founder &amp; Growth. Guida il team operativo con un approccio ossessivamente data-driven.</li>
          <li><strong>Sabrina Nastro</strong> — Growth Marketing Strategist. Esperienza internazionale (Londra), specializzata in campagne ad alta conversione.</li>
          <li><strong>Michele Cristallo</strong> — AI Specialist. Addestra le intelligenze artificiali del team e progetta integrazioni AI per il marketing.</li>
          <li><strong>Gabriele Saraiello</strong> — Automation Specialist. Owner di tracciamento del customer journey e automazioni di marketing.</li>
          <li><strong>Claudia Amodei</strong> — AI Executive.</li>
        </ul>
      </section>

      <section>
        <h2>Test: quanto è prevedibile la crescita della tua azienda?</h2>
        <p>Su <a href="https://twobee.it/test-crescita">twobee.it/test-crescita</a> c'è una scorecard di autovalutazione gratuita in otto domande, pensata per chi non conosce a memoria i propri numeri: non chiede fatturato, margini né spesa pubblicitaria, si risponde solo sì, in parte o no. Le otto aree indagate sono il tracciamento dell'origine dei clienti, la dipendenza da un solo canale, la prevedibilità delle richieste del mese successivo, il follow-up di chi chiede un preventivo e non compra subito, il collegamento fra spesa marketing e ricavi, il costo di acquisizione di un cliente, il valore di un cliente a dodici mesi e l'autonomia del marketing rispetto al titolare.</p>
        <p>Il risultato è un punteggio da 0 a 100 sulla prevedibilità della crescita, con tre zone — crescita affidata al caso (sotto 41), crescita fragile (41-70), crescita sotto controllo (oltre 70) — le falle principali emerse e tre mosse prioritarie. È un'autovalutazione, non una stima di fatturato: TwoBee non promette percentuali di ricavo in una pagina web.</p>
      </section>
